[project]
name = "paypal_sync"
authors = [
    { name = "AffiKSys", email = "m.heide@affiksys.com" }
]
description = "Holt PayPal-Umsätze über die PayPal Transaction Search API und legt sie in ERPNext als Bank Transactions an."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
